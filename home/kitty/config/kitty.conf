# ╭──────────────────────────────────────────────────────────────╮
# │ NixOS • Hyprland • Zsh • Neovim                              │
# ╰──────────────────────────────────────────────────────────────╯


# ═══════════════════════════════════════════════════════════════
# THEME
# ═══════════════════════════════════════════════════════════════
#
# Wallust is NOT used here.

foreground            #e6e0e9
background            #141218

cursor                #e6e0e9
cursor_text_color     #141218

selection_foreground  #381e72
selection_background  #ccc2dc

url_color             #d0bcff


# ─────────────────────────────────────────────────────────────
# ANSI COLORS
# ─────────────────────────────────────────────────────────────

color0   #141218
color1   #ff728f
color2   #7fff9a
color3   #ffda72
color4   #bca5f2
color5   #4e3d76
color6   #d0bcff
color7   #f4efff

color8   #9d99a5
color9   #ff9fb2
color10  #a5ffb8
color11  #ffe7a5
color12  #d7c6ff
color13  #ded0ff
color14  #e9e0ff
color15  #faf8ff


# ═══════════════════════════════════════════════════════════════
# FONT
# ═══════════════════════════════════════════════════════════════

font_family        JetBrains Mono Nerd Font

bold_font          auto
italic_font        auto
bold_italic_font   auto

font_size          12.5

disable_ligatures  never

adjust_line_height  100%
adjust_column_width 0


# ═══════════════════════════════════════════════════════════════
# WINDOW
# ═══════════════════════════════════════════════════════════════

remember_window_size      yes
remember_window_position  no

initial_window_width      1100
initial_window_height     700

window_padding_width      14
window_padding_height     10

window_border_width       0pt
draw_minimal_borders      yes

hide_window_decorations   yes


# ─────────────────────────────────────────────────────────────
# TRANSPARENCY
# ─────────────────────────────────────────────────────────────
#
# 0.68 = strong wallpaper visibility while retaining readable
# terminal content.
#
# background_blur controls the blur applied to the background
# visible through Kitty.
#

background_opacity          0.68
background_blur             48
dynamic_background_opacity  yes


# ═══════════════════════════════════════════════════════════════
# CURSOR
# ═══════════════════════════════════════════════════════════════

cursor_shape              block
cursor_shape_unfocused    hollow

cursor_blink_interval     0.5
cursor_stop_blinking_after 15.0

cursor_trail              0


# ═══════════════════════════════════════════════════════════════
# SHELL / EDITOR
# ═══════════════════════════════════════════════════════════════

shell              .
editor             .

shell_integration  enabled

allow_hyperlinks   yes

paste_actions      quote-urls-at-prompt,confirm

notify_on_cmd_finish invisible 10


# ═══════════════════════════════════════════════════════════════
# SCROLLBACK
# ═══════════════════════════════════════════════════════════════

scrollback_lines                  50000
scrollback_pager_history_size     64

scrollbar_style                   none

scrollback_fill_enlarged_window   yes


# ═══════════════════════════════════════════════════════════════
# TABS
# ═══════════════════════════════════════════════════════════════

tab_bar_edge          top

tab_bar_style         powerline
tab_powerline_style   slanted

tab_bar_align         left
tab_bar_min_tabs      2

tab_bar_margin_width  0.0
tab_bar_margin_height 2.5 1.5

tab_bar_background    #141218


# ─────────────────────────────────────────────────────────────
# ACTIVE TAB
# ─────────────────────────────────────────────────────────────

active_tab_foreground   #381e72
active_tab_background   #d0bcff
active_tab_font_style   bold


# ─────────────────────────────────────────────────────────────
# INACTIVE TAB
# ─────────────────────────────────────────────────────────────

inactive_tab_foreground #cac4cf
inactive_tab_background #141218
inactive_tab_font_style normal


# ─────────────────────────────────────────────────────────────
# TAB ACTIVITY
# ─────────────────────────────────────────────────────────────

tab_activity_symbol " ● "


tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:32]}{title[32:] and '…'}  [{index}]"

active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:32]}{title[32:] and '…'}  [{index}]"


# ═══════════════════════════════════════════════════════════════
# PERFORMANCE
# ═══════════════════════════════════════════════════════════════

repaint_delay       10
input_delay         3
sync_to_monitor     yes

wayland_enable_ime  yes

update_check_interval 0


# ═══════════════════════════════════════════════════════════════
# MOUSE / SELECTION
# ═══════════════════════════════════════════════════════════════

mouse_hide_wait 3.0

copy_on_select no

clear_selection_on_clipboard_loss yes

url_style curly

open_url_with default

allow_hyperlinks yes


# ═══════════════════════════════════════════════════════════════
# BELL
# ═══════════════════════════════════════════════════════════════

enable_audio_bell    no
visual_bell_duration 0.0


# ═══════════════════════════════════════════════════════════════
# SECURITY / REMOTE CONTROL
# ═══════════════════════════════════════════════════════════════

# Local Unix socket only.
# No TCP/network remote control.

allow_remote_control socket-only

listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

allow_cloning ask


# ═══════════════════════════════════════════════════════════════
# LAYOUTS
# ═══════════════════════════════════════════════════════════════

enabled_layouts *


# ═══════════════════════════════════════════════════════════════
# WINDOW MANAGEMENT
# ═══════════════════════════════════════════════════════════════

# New window in current working directory
map kitty_mod+enter new_window_with_cwd

map kitty_mod+n new_window_with_cwd

# Close current window
map kitty_mod+w close_window

# Fullscreen
map kitty_mod+f toggle_fullscreen

# Move between windows
map kitty_mod+left  neighboring_window left
map kitty_mod+right neighboring_window right
map kitty_mod+up    neighboring_window up
map kitty_mod+down  neighboring_window down


# ═══════════════════════════════════════════════════════════════
# TABS
# ═══════════════════════════════════════════════════════════════

# New tab in current working directory
map kitty_mod+t new_tab_with_cwd

# Previous / next tab
map kitty_mod+shift+left  previous_tab
map kitty_mod+shift+right next_tab

# Close tab
map kitty_mod+shift+w close_tab


# ─────────────────────────────────────────────────────────────
# DIRECT TAB SELECTION
# ─────────────────────────────────────────────────────────────

map kitty_mod+shift+1 goto_tab 1
map kitty_mod+shift+2 goto_tab 2
map kitty_mod+shift+3 goto_tab 3
map kitty_mod+shift+4 goto_tab 4
map kitty_mod+shift+5 goto_tab 5
map kitty_mod+shift+6 goto_tab 6
map kitty_mod+shift+7 goto_tab 7
map kitty_mod+shift+8 goto_tab 8
map kitty_mod+shift+9 goto_tab 9


# ═══════════════════════════════════════════════════════════════
# SHELL / SCROLLBACK
# ═══════════════════════════════════════════════════════════════

# Previous / next shell prompt
map kitty_mod+z scroll_to_prompt -1
map kitty_mod+x scroll_to_prompt 1

# Show last command output
map kitty_mod+g show_last_command_output

# Show scrollback
map kitty_mod+h show_scrollback

# Search scrollback
map kitty_mod+slash search_scrollback


# ═══════════════════════════════════════════════════════════════
# KITTY CONTROL
# ═══════════════════════════════════════════════════════════════

# Kitty shell
map kitty_mod+f3 kitty_shell window

# Debug configuration
map kitty_mod+f4 debug_config

# Reload configuration
map kitty_mod+f5 load_config_file


# ═══════════════════════════════════════════════════════════════
# HINTS
# ═══════════════════════════════════════════════════════════════

# Open URLs
map kitty_mod+e kitten hints --type=url --program=default

# Select filesystem paths
map kitty_mod+p>f kitten hints --type=path

# Open source file at detected line
map kitty_mod+p>n kitten hints --type=linenum --linenum-action=tab nvim +{line} {path}

# Open hyperlinks
map kitty_mod+p>y kitten hints --type=hyperlink --program=default


# ═══════════════════════════════════════════════════════════════
# UNICODE
# ═══════════════════════════════════════════════════════════════

map kitty_mod+u kitten unicode_input


# ═══════════════════════════════════════════════════════════════
# COPY / PASTE
# ═══════════════════════════════════════════════════════════════

map --allow-fallback=shifted,ascii kitty_mod+c copy_to_clipboard

map --allow-fallback=shifted,ascii kitty_mod+v paste_from_clipboard

# Copy if possible, interrupt otherwise
map kitty_mod+shift+c copy_or_interrupt


# ═══════════════════════════════════════════════════════════════
# FONT SCALING
# ═══════════════════════════════════════════════════════════════

# Increase
map kitty_mod+equal change_font_size all +1.0

# Decrease
map kitty_mod+minus change_font_size all -1.0

# Reset
map kitty_mod+backspace change_font_size all 0

