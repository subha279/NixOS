# ╭──────────────────────────────────────────────────────────────╮
# │ NixOS • Hyprland • Zsh • Neovim                              │
# ╰──────────────────────────────────────────────────────────────╯

# ─────────────────────────────────────────────────────────────
# AURORA THEME
# ─────────────────────────────────────────────────────────────

include ~/.config/aurora/active-kitty.conf

# ─────────────────────────────────────────────────────────────
# FONT
# ─────────────────────────────────────────────────────────────

bold_font        auto
italic_font      auto
bold_italic_font auto
# Keep this at 100%.
#
# Starship's prompt wraps the git branch in powerline half-circle
# glyphs (U+E0B6 / U+E0B4). Those are designed to fill exactly one
# cell, so stretching the cell height makes them stop lining up with
# the pill they wrap and the icons render subtly wrong.
adjust_line_height 100%

# Window layout
cursor_shape                 block
shell_integration            enabled
cursor_trail                 1
cursor_trail_decay           0.05 0.25
cursor_trail_start_threshold 5
remember_window_size  yes
initial_window_width  900
initial_window_height 600
window_padding_width  15
hide_window_decorations no
background_opacity 0.92

# Blur is owned by Hyprland (decoration.lua + layerules.lua).
# Enabling it here too blurs the same pixels a second time.
background_blur 0

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

# Advanced
shell .
editor .
# aurora-theme (home/theme/default.nix) recolours already-open windows
# with `kitten @ set-colors`. That needs a socket, and the switcher
# globs $XDG_RUNTIME_DIR/kitty-* -- so the socket name must match.
allow_remote_control socket-only
listen_on unix:$XDG_RUNTIME_DIR/kitty-{kitty_pid}
update_check_interval 0

# Performance tuning
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Mouse
mouse_hide_wait 3.0
url_style curly
open_url_with default
copy_on_select yes

# Scrollback
scrollback_lines 10000
confirm_os_window_close 0

# NOTE: do NOT set `foreground`/`background` here.
# This file includes ~/.config/aurora/active-kitty.conf at the top, and
# kitty applies last-wins, so any colour set below would permanently
# override the Aurora theme for every one of the 21 palettes.
