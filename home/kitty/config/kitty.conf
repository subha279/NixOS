# ╭──────────────────────────────────────────────────────────────╮
# │ NixOS • Hyprland • Zsh • Neovim                              │
# ╰──────────────────────────────────────────────────────────────╯


# ─────────────────────────────────────────────────────────────
# AURORA THEME
# ─────────────────────────────────────────────────────────────

include ~/.config/aurora/active-kitty.conf


# ─────────────────────────────────────────────────────────────
# FONT
# ─────────────────────────────────────────────────────────────

font_family        JetBrains Mono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          12.0

disable_ligatures  never

adjust_line_height  100%
adjust_column_width 0


# ─────────────────────────────────────────────────────────────
# WINDOW
# ─────────────────────────────────────────────────────────────

remember_window_size      yes
remember_window_position  no

initial_window_width      1100
initial_window_height     700

window_padding_width      14
window_padding_height     10

window_border_width       0pt
draw_minimal_borders      yes

hide_window_decorations   yes

background_opacity        0.88
background_blur           32

dynamic_background_opacity yes


# ─────────────────────────────────────────────────────────────
# CURSOR
# ─────────────────────────────────────────────────────────────

cursor_shape              block
cursor_shape_unfocused    hollow

cursor_blink_interval     0.5
cursor_stop_blinking_after 15.0


# ─────────────────────────────────────────────────────────────
# SHELL
# ─────────────────────────────────────────────────────────────

shell               .
editor              .

shell_integration   enabled

allow_hyperlinks    yes

paste_actions       quote-urls-at-prompt,confirm

notify_on_cmd_finish invisible 10


# ─────────────────────────────────────────────────────────────
# SCROLLBACK
# ─────────────────────────────────────────────────────────────

scrollback_lines                50000
scrollback_pager_history_size   64

scrollbar_style                 none

scrollback_fill_enlarged_window yes


# ─────────────────────────────────────────────────────────────
# TABS
# ─────────────────────────────────────────────────────────────

tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted

tab_bar_align         left
tab_bar_min_tabs      2

tab_bar_margin_width  0.0
tab_bar_margin_height 2.5 1.5

tab_activity_symbol " ● "

tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:32]}{title[32:] and '…'}  [{index}]"

active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:32]}{title[32:] and '…'}  [{index}]"


# ─────────────────────────────────────────────────────────────
# REMOTE CONTROL
# ─────────────────────────────────────────────────────────────

allow_remote_control socket-only

listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

allow_cloning ask


# ─────────────────────────────────────────────────────────────
# PERFORMANCE
# ─────────────────────────────────────────────────────────────

repaint_delay      10
input_delay        3

sync_to_monitor    yes

update_check_interval 0


# ─────────────────────────────────────────────────────────────
# BELL
# ─────────────────────────────────────────────────────────────

enable_audio_bell    no
visual_bell_duration 0.0


# ─────────────────────────────────────────────────────────────
# MOUSE
# ─────────────────────────────────────────────────────────────

mouse_hide_wait       3.0

copy_on_select        no

clear_selection_on_clipboard_loss yes

url_style             curly

open_url_with         default
