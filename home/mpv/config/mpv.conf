# MPV — Main Configuration

# VIDEO OUTPUT
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk

# HARDWARE DECODING
# Automatically use supported hardware decoding.
# GTX 1650 handles H.264 / HEVC / VP9 through NVDEC.
# AV1 falls back to software decoding because the GTX 1650
# does not provide AV1 hardware decoding.
hwdec=auto

# VIDEO PRESENTATION
# Synchronize playback to the audio clock.
video-sync=audio

# Allow video output to drop frames if necessary rather than
# allowing the video pipeline to stall.
framedrop=vo

# SCALING
# High-quality chroma upscaling.
cscale=ewa_lanczos

# High-quality image upscaling.
scale=ewa_lanczos

# High-quality downscaling.
dscale=mitchell

# Improve downscaling when appropriate.
correct-downscaling=yes

# Improve perceived smoothness of gradients during upscaling.
sigmoid-upscaling=yes

# DEBANDING
# Reduce color banding in compressed/low-quality sources.
deband=yes
deband-iterations=2
deband-threshold=32
deband-range=16
deband-grain=0

# DITHERING
# Let MPV choose an appropriate output depth.
dither-depth=auto

# High-quality dithering.
dither=fruit

# Temporal dithering helps reduce visible banding.
temporal-dither=yes

# COLOR MANAGEMENT
# Automatically determine source/target color characteristics.
target-prim=auto
target-trc=auto

# Better gamut mapping for colors outside the target gamut.
gamut-mapping-mode=perceptual

# SUBTITLES
sub-auto=fuzzy
sub-font-size=42
sub-border-size=2
sub-shadow-offset=1

# OSD
osd-font="JetBrains Mono Nerd Font"
osd-font-size=32
osd-border-size=2
osd-shadow-offset=1
osd-bar-align-y=0.90

# WINDOW
keepaspect=yes

# SCREENSHOTS
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-template="~/Pictures/mpv/%F-%wH%wM%wS-%p"

# CACHE
cache=yes
cache-secs=20

# PLAYBACK
# Remember playback position.
save-position-on-quit=yes

# Close after playback finishes.
keep-open=no

# MOUSE / CURSOR
# Hide the cursor after 1 second.
cursor-autohide=1000

# YOUTUBE / yt-dlp
# Prefer H.264 video at or below 1080p.
# GTX 1650 has NVDEC support for H.264.
ytdl-format=bestvideo[height<=1080][vcodec^=avc1]+bestaudio/best[height<=1080][vcodec^=avc1]
