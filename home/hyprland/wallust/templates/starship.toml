# ==========================================
# STARSHIP
# Aurora UI / Purple Accent
# ==========================================
# Independent theme.
# No Wallust dependency.
#
# Designed to match:
# - dark navy/charcoal surfaces
# - lavender/purple accent
# - bright white text
# - cool gray secondary text
# ==========================================

add_newline = false
command_timeout = 1000
scan_timeout = 30
follow_symlinks = false

palette = "aurora"


# ==========================================
# PROMPT
# ==========================================

format = """
$os\
$directory\
${custom.giturl}\
$git_branch\
${custom.git_worktree}\
$git_status\
$package\
$nodejs\
$bun\
$c\
$rust\
$golang\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$cmd_duration\
$character"""


# ==========================================
# AURORA PALETTE
# ==========================================

[palettes.aurora]

# ------------------------------------------
# Main surfaces
# ------------------------------------------

bg = "#171D27"
surface = "#202733"
surface2 = "#2A3240"
surface3 = "#343D4D"

# ------------------------------------------
# Text
# ------------------------------------------

text = "#F4F5F7"
text_soft = "#D7DBE2"
muted = "#A8AFBB"
dim = "#7F8897"

# ------------------------------------------
# Primary accent
# ------------------------------------------

purple = "#A875FF"
purple_bright = "#B98AFF"
purple_soft = "#9B7AE8"
purple_dark = "#7350B8"

# ------------------------------------------
# Cool accents
# ------------------------------------------

blue = "#8AA4FF"
cyan = "#82D9E8"

# ------------------------------------------
# Status
# ------------------------------------------

green = "#7FE0A5"
yellow = "#F3D27A"
orange = "#F2A76B"
red = "#F27F8A"
pink = "#E59AEF"


# ==========================================
# OS
# ==========================================

[os]

disabled = false

style = "bold text"

format = "[$symbol ]($style)"

[os.symbols]

NixOS = ""

Linux = "󰌽"
Arch = "󰣇"
Artix = "󰣇"
Ubuntu = "󰕈"
Fedora = "󰣛"
Debian = "󰣚"
Gentoo = "󰣨"
Manjaro = ""
Mint = "󰣭"
SUSE = ""
Raspbian = "󰐿"
Alpine = ""
Amazon = ""
Android = ""
CentOS = ""
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Macos = ""
Windows = "󰍲"


# ==========================================
# DIRECTORY
# ==========================================

[directory]

style = "bold text"

format = "[$path]($style)[$read_only]($read_only_style) "

home_symbol = "~"

truncation_length = 3
truncate_to_repo = false

truncation_symbol = "…/"

read_only = " 󰌾"
read_only_style = "bold red"

[directory.substitutions]

Documents = "󰈙 "
Downloads = " "
Music = " "
Pictures = " "
Developer = "󰲋 "
Others = " "


# ==========================================
# GIT REMOTE
# ==========================================

[custom.giturl]

description = "Display symbol for remote Git server"

command = """
GIT_REMOTE=$(git remote get-url origin 2>/dev/null)

case "$GIT_REMOTE" in
    *github*)
        echo ""
        ;;
    *gitlab*)
        echo ""
        ;;
    *bitbucket*)
        echo ""
        ;;
    *git*)
        echo ""
        ;;
    *)
        echo ""
        ;;
esac
"""

when = "git rev-parse --is-inside-work-tree 2>/dev/null"

format = "[$output](bold purple) "

require_repo = true
ignore_timeout = true


# ==========================================
# GIT BRANCH
# ==========================================

[git_branch]

symbol = " "

# Purple badge with bright text,
# matching the purple controls in the UI.

format = "[](purple)[ $symbol$branch ](bold bg bg:purple)[](purple) "


# ==========================================
# GIT WORKTREE
# ==========================================

[custom.git_worktree]

description = "Show indicator when inside a Git worktree"

command = """
if git rev-parse --git-dir >/dev/null 2>&1; then
    common_dir=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)
    git_dir=$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)

    if [ "$common_dir" != "$git_dir" ]; then
        echo "⛓"
    fi
fi
"""

when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"

format = "[$output](bold purple) "

style = "bold purple"

require_repo = true
ignore_timeout = true


# ==========================================
# GIT STATUS
# ==========================================

[git_status]

style = "bold text"

format = "[$untracked$staged$modified$renamed$deleted$conflicted$stashed$typechanged$ahead_behind]($style) "

# ------------------------------------------
# Working tree
# ------------------------------------------

untracked = "[?](bold red)"

staged = "[+](bold green)"

modified = "[!](bold yellow)"

renamed = "[»](bold blue)"

deleted = "[-](bold red)"

conflicted = "[✖](bold red)"

stashed = "[≡](bold purple)"

typechanged = "[󰜄](bold cyan)"

# ------------------------------------------
# Remote
# ------------------------------------------

ahead = "[⇡${count}](bold cyan)"

behind = "[⇣${count}](bold orange)"

diverged = "[⇕⇡${ahead_count}⇣${behind_count}](bold pink)"

up_to_date = ""


# ==========================================
# PACKAGE
# ==========================================

[package]

disabled = false

symbol = "󰏗 "

style = "bold purple"

format = "[$symbol$version]($style) "


# ==========================================
# NODE.JS
# ==========================================

[nodejs]

symbol = ""

style = "bold green"

format = "[$symbol( $version)]($style) "


# ==========================================
# BUN
# ==========================================

[bun]

symbol = "🥟"

style = "bold orange"

format = "[$symbol( $version)]($style) "

detect_files = [
    "bun.lock",
    "bun.lockb",
]


# ==========================================
# C
# ==========================================

[c]

symbol = " "

style = "bold blue"

format = "[$symbol( $version)]($style) "


# ==========================================
# RUST
# ==========================================

[rust]

symbol = ""

style = "bold orange"

format = "[$symbol( $version)]($style) "


# ==========================================
# GO
# ==========================================

[golang]

symbol = ""

style = "bold cyan"

format = "[$symbol( $version)]($style) "

detect_files = [
    "go.mod",
]


# ==========================================
# PHP
# ==========================================

[php]

symbol = ""

style = "bold purple"

format = "[$symbol( $version)]($style) "


# ==========================================
# JAVA
# ==========================================

[java]

symbol = " "

style = "bold red"

format = "[$symbol( $version)]($style) "


# ==========================================
# KOTLIN
# ==========================================

[kotlin]

symbol = ""

style = "bold pink"

format = "[$symbol( $version)]($style) "


# ==========================================
# HASKELL
# ==========================================

[haskell]

symbol = ""

style = "bold purple"

format = "[$symbol( $version)]($style) "


# ==========================================
# PYTHON
# ==========================================

[python]

symbol = ""

style = "bold yellow"

format = "[$symbol( $version)]($style) "


# ==========================================
# DOCKER
# ==========================================

[docker_context]

symbol = ""

style = "bold cyan"

format = "[$symbol( $context)]($style) "


# ==========================================
# TIME
# ==========================================

[time]

disabled = true

time_format = "%R"

style = "bold muted"

format = "[󰥔 $time]($style) "


# ==========================================
# COMMAND DURATION
# ==========================================

[cmd_duration]

min_time = 1000

style = "bold muted"

format = "󰔟 [$duration]($style) "


# ==========================================
# PROMPT CHARACTER
# ==========================================

[character]

success_symbol = "[❯](bold purple)"

error_symbol = "[❯](bold red)"

vimcmd_symbol = "[❮](bold cyan)"

vimcmd_replace_one_symbol = "[❮](bold pink)"

vimcmd_replace_symbol = "[❮](bold pink)"

vimcmd_visual_symbol = "[❮](bold purple)"
