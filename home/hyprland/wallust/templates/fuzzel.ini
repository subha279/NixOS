# ============================================================
# Dynamic Wallust Theme
# ============================================================

[main]

# ============================================================
# Typography
# ============================================================

# Inter = clean UI
# JetBrains Mono Nerd Font = Nerd Font icon fallback
font=Inter:size=12,JetBrains Mono Nerd Font:size=12

use-bold=yes

# ============================================================
# Layout
# ============================================================

width=48
lines=9

horizontal-pad=22
vertical-pad=16
inner-pad=12

line-height=28
letter-spacing=0

# ============================================================
# Window
# ============================================================

layer=overlay
anchor=center

exit-on-keyboard-focus-loss=yes
keyboard-focus=exclusive

# ============================================================
# Icons
# ============================================================

icons-enabled=yes

icon-theme=Papirus-Dark

image-size-ratio=0.32

dpi-aware=auto
scaling-filter=lanczos3

# ============================================================
# Launcher
# ============================================================

terminal=kitty

prompt="  󰍉  "
placeholder="Search applications..."

# ============================================================
# Wallust Colors
# ============================================================

[colors]

# ------------------------------------------------------------
# Main surface
# ------------------------------------------------------------

# Dark glass / near-black.
# Wallust still controls the underlying tone.

background={{background}}f2

# ------------------------------------------------------------
# Normal text
# ------------------------------------------------------------

text={{foreground}}f5

# ------------------------------------------------------------
# Prompt
# ------------------------------------------------------------

prompt={{color4}}ff

# ------------------------------------------------------------
# Placeholder
# ------------------------------------------------------------

placeholder={{color8}}ff

# ------------------------------------------------------------
# Search input
# ------------------------------------------------------------

input={{foreground}}ff

# ------------------------------------------------------------
# Matching characters
# ------------------------------------------------------------

match={{color4}}ff

# ------------------------------------------------------------
# SELECTED ITEM
# ------------------------------------------------------------

# IMPORTANT:
# Do NOT use color0 here.
# color0 is frequently almost black and disappears
# against the dark Fuzzel background.

selection={{foreground}}25

selection-text={{foreground}}ff

selection-match={{color4}}ff

# ------------------------------------------------------------
# Counter
# ------------------------------------------------------------

counter={{color8}}ff

# ------------------------------------------------------------
# Border
# ------------------------------------------------------------

border={{color4}}70


# ============================================================
# Border
# ============================================================

[border]

width=2
radius=18

# Rounded selected rows.
selection-radius=10


# ============================================================
# Dmenu
# ============================================================

[dmenu]

mode=text

exit-immediately-if-empty=yes


# ============================================================
# Keyboard
# ============================================================

[key-bindings]

cancel=Escape Control+g Control+c

execute=Return KP_Enter

cursor-left=Left Control+b
cursor-right=Right Control+f

prev=Up Control+p
next=Down Control+n

first=Control+Home
last=Control+End
