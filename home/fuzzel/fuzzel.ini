# ============================================================
# Aurora Fuzzel
#
# Layout / behavior lives here.
# Theme colors + font are controlled by Aurora.
#
#   ~/.config/aurora/active-fuzzel.conf
#
# ============================================================

include=~/.config/aurora/active-fuzzel.conf


# ============================================================
# Main
# ============================================================

[main]

# Aurora controls the font.
# Do not hard-code a font here.

terminal=kitty

prompt=" 󱄅  "

placeholder="Search applications..."

# ------------------------------------------------------------
# Size / spacing
# ------------------------------------------------------------

width=46

lines=8

horizontal-pad=22

vertical-pad=16

inner-pad=10

line-height=28

letter-spacing=0

# ------------------------------------------------------------
# Position
# ------------------------------------------------------------

layer=overlay

anchor=center

exit-on-keyboard-focus-loss=yes

# ------------------------------------------------------------
# Icons
# ------------------------------------------------------------

icons-enabled=yes

# icon-theme intentionally unset: lib/themes.nix already declares
# Colloid-Dark and stylix installs it, so hardcoding Papirus-Dark here made
# the launcher the only surface using a different icon set -- and the "-Dark"
# suffix was wrong for the three light themes.

# Ratio of icon size to line-height. 0.38 x 28px gave ~11px icons, below the
# smallest size most icon themes ship, so they rendered blurry.
image-size-ratio=0.6

# ------------------------------------------------------------
# Rendering
# ------------------------------------------------------------

dpi-aware=auto

scaling-filter=bilinear


# ============================================================
# Dmenu
# ============================================================

[dmenu]

mode=text

exit-immediately-if-empty=yes


# ============================================================
# Keybindings
# ============================================================

[key-bindings]

cancel=Escape Control+g Control+c

execute=Return KP_Enter

cursor-left=Left Control+b

cursor-right=Right Control+f

prev=Up Control+p

next=Down Control+n

first=Control+Home

last=Control+End
