[main]

font=JetBrainsMono Nerd Font:size=11

terminal=kitty

prompt="  󱄅  "

placeholder="Search applications..."

width=42

lines=8

horizontal-pad=18
vertical-pad=12
inner-pad=8

line-height=24

letter-spacing=0

layer=overlay

anchor=center

exit-on-keyboard-focus-loss=yes

icons-enabled=yes

icon-theme=Papirus-Dark

image-size-ratio=0.35

dpi-aware=auto

scaling-filter=bilinear

[colors]

background=111318e8
text=d9e1f2ff

prompt=89b4faff

placeholder=7f849cff

input=d9e1f2ff

match=89b4faff

selection=313849d9

selection-text=f5f7ffff

selection-match=a6e3ffff

counter=7f849cff

border=89b4fa66

[border]

width=1

radius=14

[dmenu]

mode=text

exit-immediately-if-empty=yes

[key-bindings]

cancel=Escape Control+g Control+c
execute=Return KP_Enter
cursor-left=Left Control+b
cursor-right=Right Control+f
prev=Up Control+p
next=Down Control+n
first=Control+Home
last=Control+End
