[main]

# ============================================================
# Aurora Fuzzel
#
# Layout / behavior lives here.
#
# Theme colors are loaded from:
#
#   ~/.config/aurora/active-fuzzel.conf
#
# ============================================================

include=~/.config/aurora/active-fuzzel.conf


# ------------------------------------------------------------
# General
# ------------------------------------------------------------

font=JetBrainsMono Nerd Font:size=11

terminal=kitty

prompt="  󱄅  "

placeholder="Search applications..."

width=42

lines=8

horizontal-pad=18

vertical-pad=12

inner-pad=8

line-height=24

letter-spacing=0

layer=overlay

anchor=center

exit-on-keyboard-focus-loss=yes


# ------------------------------------------------------------
# Icons
# ------------------------------------------------------------

icons-enabled=yes

icon-theme=Papirus-Dark

image-size-ratio=0.35


# ------------------------------------------------------------
# Rendering
# ------------------------------------------------------------

dpi-aware=auto

scaling-filter=bilinear


# ============================================================
# Dmenu
# ============================================================

[dmenu]

mode=text

exit-immediately-if-empty=yes


# ============================================================
# Keybindings
# ============================================================

[key-bindings]

cancel=Escape Control+g Control+c

execute=Return KP_Enter

cursor-left=Left Control+b

cursor-right=Right Control+f

prev=Up Control+p

next=Down Control+n

first=Control+Home

last=Control+End
