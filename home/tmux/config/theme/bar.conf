# ---- Core ----
set -g status on
set -g status-justify left
set -g status-style "bg=default,fg=#{@THM_FG}"
set -g status-left-length 40
set -g status-right-length 60

# ---- Windows ----
set -g window-status-separator ""

# Focused window
set -g window-status-current-format "#[fg=#{@THM_ACCENT},bg=default]#[fg=#{@THM_BG},bg=#{@THM_ACCENT},bold] #I #W #[fg=#{@THM_ACCENT},bg=default] "

# Unfocused window
set -g window-status-format "#[fg=#{@THM_TEXT_MUTED},bg=default] #I #W "

# ---- Status Left ----
set -g status-left "#[fg=#{@THM_ACCENT},bg=default]#[fg=#{@THM_BG},bg=#{@THM_ACCENT},bold]#{?client_prefix,󰠠 ,󰤂 }#[bold,nodim]#S#[fg=#{@THM_ACCENT},bg=default] "

# ---- Status Right ----
set -g status-right "#[fg=#{@THM_TEXT_SECONDARY},bg=default,bold]%d %B %Y, %A"

# ---- Panes ----
set -g pane-border-style "fg=#{@THM_BORDER}"
set -g pane-active-border-style "fg=#{@THM_ACCENT}"

# ---- Messages / Command Prompt ----
set -g message-style "bg=default,fg=#{@THM_YELLOW},bold"
set -g message-command-style "bg=default,fg=#{@THM_YELLOW}"

# ---- Copy Mode ----
set -g mode-style "bg=#{@THM_ACCENT},fg=#{@THM_BG}"

# ---- Clock Mode ---- (colors set literally in per-theme file)
set -g clock-mode-style 24

# ---- Activity ----
set -g monitor-activity off
set -g visual-activity off
